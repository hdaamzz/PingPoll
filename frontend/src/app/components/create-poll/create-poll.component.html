<div class="min-h-screen bg-linear-to-br from-[#FCF8F8] via-[#FBEFEF] to-[#F9DFDF]">
  <!-- Background Decorative Elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div
      class="absolute top-20 left-10 w-72 h-72 bg-[#F5AFAF]/20 rounded-full blur-3xl animate-pulse"
    ></div>
    <div
      class="absolute bottom-20 right-10 w-96 h-96 bg-[#F9DFDF]/30 rounded-full blur-3xl animate-pulse delay-1000"
    ></div>
  </div>

  <!-- Main Content -->
  <main class="relative z-10 flex items-center justify-center px-4 py-10">
    <div
      class="w-full max-w-3xl bg-white/40 backdrop-blur-xl border border-white/60 rounded-3xl shadow-xl p-6 sm:p-8"
    >
      <!-- Header -->
      <div class="flex items-center justify-between mb-6">
        <div>
          <h2 class="text-2xl font-bold text-black">
            Create a new poll
          </h2>
          <p class="text-sm text-black/70 mt-1">
            Define your poll details and share it with your audience.
          </p>
        </div>

        <button
          (click)="cancel()"
          class="hidden sm:inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white text-black text-sm font-semibold border border-black/10 hover:bg-black/5 transition-all"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
          Cancel
        </button>
      </div>

      <!-- Form -->
      <form
        (ngSubmit)="submit()"
        class="space-y-6"
        autocomplete="off"
      >
        <!-- Title -->
        <div class="space-y-2">
          <label class="block text-sm font-semibold text-black">
            Poll title
          </label>
          <input
            type="text"
            class="w-full rounded-xl border border-black/10 bg-white/70 px-4 py-3 text-black text-sm outline-none focus:ring-2 focus:ring-[#F5AFAF] focus:border-transparent placeholder:text-black/40"
            placeholder="E.g. Favorite Programming Language"
            [ngModel]="title()"
            (ngModelChange)="title.set($event)"
            name="title"
          />
        </div>

        <!-- Question -->
        <div class="space-y-2">
          <label class="block text-sm font-semibold text-black">
            Question
          </label>
          <textarea
            rows="3"
            class="w-full rounded-xl border border-black/10 bg-white/70 px-4 py-3 text-black text-sm outline-none focus:ring-2 focus:ring-[#F5AFAF] focus:border-transparent placeholder:text-black/40 resize-none"
            placeholder="E.g. What is your favorite programming language and why?"
            [ngModel]="question()"
            (ngModelChange)="question.set($event)"
            name="question"
          ></textarea>
        </div>

        <!-- Options -->
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <label class="block text-sm font-semibold text-black">
              Options
            </label>
            <p class="text-xs text-black/60">
              Minimum 2 options, maximum 6 options.
            </p>
          </div>

          <div class="space-y-3">
            @for (option of options(); track option.id) {
            <div class="flex items-center gap-2">
              <span
                class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-[#F5AFAF]/20 text-xs font-semibold text-black"
              >
                {{ option.id }}
              </span>
              <input
                type="text"
                class="flex-1 rounded-xl border border-black/10 bg-white/70 px-3 py-2 text-black text-sm outline-none focus:ring-2 focus:ring-[#F5AFAF] focus:border-transparent placeholder:text-black/40"
                placeholder="Option {{ option.id }}"
                [ngModel]="option.text"
                (ngModelChange)="updateOptionText(option.id, $event)"
                name="option-{{ option.id }}"
              />
              <button
                type="button"
                (click)="removeOption(option.id)"
                class="inline-flex items-center justify-center rounded-lg p-1.5 text-black/60 hover:bg-black/5 hover:text-black transition-all"
                [disabled]="options().length <= 2"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"
                  />
                </svg>
              </button>
            </div>
            }
          </div>

          <button
            type="button"
            (click)="addOption()"
            class="mt-1 inline-flex items-center gap-2 text-sm font-semibold text-black px-3 py-1.5 rounded-lg bg-[#F5AFAF]/20 hover:bg-[#F5AFAF]/30 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="options().length >= 6"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4v16m8-8H4"
              />
            </svg>
            Add option
          </button>
        </div>

        <!-- Expiry -->
        <div class="space-y-2">
          <label class="block text-sm font-semibold text-black">
            Expiration date (optional)
          </label>
          <input
            type="datetime-local"
            class="w-full rounded-xl border border-black/10 bg-white/70 px-4 py-3 text-black text-sm outline-none focus:ring-2 focus:ring-[#F5AFAF] focus:border-transparent"
            [ngModel]="expiresAt()"
            (ngModelChange)="expiresAt.set($event)"
            name="expiresAt"
          />
          <p class="text-xs text-black/60">
            After this time, the poll will be marked as closed.
          </p>
        </div>

        <!-- Actions -->
        <div
          class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-4 border-t border-black/10"
        >
          <button
            type="button"
            (click)="cancel()"
            class="sm:hidden inline-flex items-center justify-center gap-2 px-4 py-2 rounded-xl bg-white text-black text-sm font-semibold border border-black/10 hover:bg-black/5 transition-all"
          >
            Cancel
          </button>

          <p class="text-xs text-black/60">
            You can edit or close this poll anytime from your dashboard.
          </p>

          <button
            type="submit"
            [disabled]="isSubmitting()"
            class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-linear-to-r from-[#F5AFAF] to-[#F9DFDF] text-black text-sm font-semibold shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all disabled:opacity-60 disabled:hover:translate-y-0"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4v1m0 4v11m0-11a4 4 0 014 4m-4-4a4 4 0 00-4 4"
              />
            </svg>
            {{ isSubmitting() ? 'Creating...' : 'Create poll' }}
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
